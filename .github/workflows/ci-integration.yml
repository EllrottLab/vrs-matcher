name: Integration CI

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

env:
  SEQREPO_INSTANCE: "2024-12-20"
  SEQREPO_ROOT: .github/workflow-data/seqrepo

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install integration dependencies
        run: uv sync --group dev --group integration

      - name: Cache seqrepo
        id: cache-seqrepo
        uses: actions/cache@v4
        with:
          path: ${{ env.SEQREPO_ROOT }}/${{ env.SEQREPO_INSTANCE }}
          key: seqrepo-${{ env.SEQREPO_INSTANCE }}

      - name: Download seqrepo
        if: steps.cache-seqrepo.outputs.cache-hit != 'true'
        env:
          SEQREPO_ROOT: ${{ env.SEQREPO_ROOT }}
          SEQREPO_INSTANCE: ${{ env.SEQREPO_INSTANCE }}
        run: scripts/setup_integration_data.sh

      - name: Run integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
          GA4GH_VRS_DATAPROXY_URI: "seqrepo+file://${{ env.SEQREPO_ROOT }}/${{ env.SEQREPO_INSTANCE }}"
        run: uv run pytest -m integration --run-integration
