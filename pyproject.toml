[project]
name = "vrs-matcher"
version = "0.1.0"
description = "Match samples based on VRS identifiers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "click>=8.1.0",
  "cyvcf2>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.11.0",
]
integration = [
  "ga4gh.vrs[extras]>=2.0.0",
  "pysam>=0.23.0",
  "requests>=2.32.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrs_matcher"]

[tool.hatch.build.targets.sdist]
include = [
  "src/vrs_matcher",
  "tests",
  "README.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

[project.scripts]
vrs-matcher = "vrs_matcher.cli:cli"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --cov=vrs_matcher --cov-report=xml --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: slow tests requiring network access (deselect with '-m not integration')",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
